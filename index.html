
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Choose One 🍦🍲</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at 15% 20%, #fff0f7 0%, transparent 30%),
                radial-gradient(circle at 85% 80%, #e5faff 0%, transparent 30%),
                linear-gradient(135deg, #ffd8e8, #d8f4ff);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 680px;

            background: rgba(255, 255, 255, 0.94);

            border-radius: 35px;

            padding: 42px 25px;

            text-align: center;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.16);

            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            border-radius: 50%;

            background: #ffd9e9;

            opacity: 0.35;

            top: -90px;
            left: -70px;
        }

        .container::after {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            border-radius: 50%;

            background: #d6f6ff;

            opacity: 0.45;

            bottom: -90px;
            right: -70px;
        }

        #question,
        #reveal {
            position: relative;
            z-index: 2;
        }

        .main-icon {
            font-size: 72px;

            margin-bottom: 12px;

            animation: floating 2.5s ease-in-out infinite;
        }

        @keyframes floating {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        h1 {
            font-size: 38px;

            color: #333;

            margin-bottom: 12px;

            font-weight: 800;
        }

        .description {
            color: #777;

            font-size: 18px;

            line-height: 1.5;

            margin-bottom: 32px;
        }

        .buttons {
            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 14px;

            min-height: 280px;

            position: relative;
        }

        button {
            border: none;

            cursor: pointer;

            font-family: Arial, sans-serif;

            font-weight: 700;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                left 0.4s ease,
                top 0.4s ease;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.13);

            position: relative;
        }

        button:hover {
            box-shadow:
                0 13px 28px rgba(0, 0, 0, 0.18);
        }

        button:active {
            transform: scale(0.95);
        }

        /* SMALL WRONG BUTTONS */

        #iceCream,
        #hotpot {
            width: 65%;

            max-width: 280px;

            padding: 13px 18px;

            border-radius: 18px;

            font-size: 17px;
        }

        #iceCream {
            background: linear-gradient(
                135deg,
                #ffc1df,
                #ffdaeb
            );

            color: #6b2148;
        }

        #hotpot {
            background: linear-gradient(
                135deg,
                #ffb66f,
                #ffd092
            );

            color: #71370f;
        }

        /* BIG CORRECT BUTTON */

        #nothing {
            width: 90%;

            max-width: 420px;

            padding: 23px 25px;

            border-radius: 25px;

            font-size: 26px;

            background: linear-gradient(
                135deg,
                #86e99a,
                #baf3c4
            );

            color: #205a2b;

            box-shadow:
                0 12px 28px rgba(54, 150, 76, 0.25);

            z-index: 20;
        }

        #nothing:hover {
            transform: scale(1.04);
        }

        #message {
            min-height: 35px;

            margin-top: 10px;

            color: #e75480;

            font-size: 19px;

            font-weight: 700;
        }

        #reveal {
            display: none;
        }

        #reveal h1 {
            color: #e75480;
        }

        .final-text {
            color: #666;

            font-size: 19px;

            line-height: 1.6;

            margin-bottom: 25px;
        }

        video {
            width: 100%;

            max-width: 560px;

            border-radius: 24px;

            background: #000;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.22);
        }

        .small-text {
            color: #999;

            font-size: 14px;

            margin-top: 18px;
        }

        .floating-food {
            position: fixed;

            pointer-events: none;

            font-size: 35px;

            animation:
                floatUp 4s linear forwards;

            z-index: 9999;
        }

        @keyframes floatUp {

            0% {
                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 1;
            }

            100% {
                transform:
                    translateY(-100vh)
                    rotate(360deg);

                opacity: 0;
            }
        }

        .shake {
            animation:
                shake 0.4s ease;
        }

        @keyframes shake {

            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-7px);
            }

            50% {
                transform: translateX(7px);
            }

            75% {
                transform: translateX(-5px);
            }

            100% {
                transform: translateX(0);
            }
        }

        @media (max-width: 500px) {

            body {
                padding: 12px;
            }

            .container {
                padding: 32px 16px;

                border-radius: 28px;
            }

            .main-icon {
                font-size: 55px;
            }

            h1 {
                font-size: 29px;
            }

            .description {
                font-size: 16px;
            }

            #iceCream,
            #hotpot {
                width: 62%;

                font-size: 15px;

                padding: 12px 15px;
            }

            #nothing {
                width: 92%;

                font-size: 23px;

                padding: 21px 20px;
            }

            #message {
                font-size: 17px;
            }

            .final-text {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- QUESTION -->

        <div id="question">

            <div class="main-icon">
                🍦🍲
            </div>

            <h1>
                Choose One 🍽️
            </h1>

            <p
                class="description"
                id="description"
            >
                Think carefully... Which one would you choose? 🤔
            </p>

            <div class="buttons">

                <button
                    id="iceCream"
                    onclick="wrongChoice('Ice Cream', this)"
                >
                    🍦 Ice Cream
                </button>

                <button
                    id="hotpot"
                    onclick="wrongChoice('Hotpot', this)"
                >
                    🍲 Hotpot
                </button>

                <button
                    id="nothing"
                    onclick="correctChoice()"
                >
                    🚫 Nothing
                </button>

            </div>

            <div id="message"></div>

        </div>


        <!-- REVEAL -->

        <div id="reveal">

            <div class="main-icon">
                🍦🍨🍧
            </div>

            <h1>
                You Chose The Right One! 🎉
            </h1>

            <p class="final-text">
                Finally! You found the correct choice. 😆
            </p>

            <video
                id="finalVideo"
                controls
                autoplay
                loop
                playsinline
                onplay="videoStarted()"
            >
                <source
                    src="video.mp4"
                    type="video/mp4"
                >

                Your browser does not support the video.
            </video>

            <p class="small-text">
                Enjoy the video! 🍿✨
            </p>

        </div>

    </div>


    <script>

        // =====================================================
        // FORMSPREE
        // =====================================================

        const FORMSPREE_URL =
            "https://formspree.io/f/mljdjlka";


        // =====================================================
        // VISITOR ID
        // =====================================================

        let visitorId =
            sessionStorage.getItem("visitorId");


        if (!visitorId) {

            if (
                window.crypto &&
                crypto.randomUUID
            ) {

                visitorId =
                    crypto.randomUUID();

            } else {

                visitorId =
                    Date.now().toString(36) +
                    Math.random()
                        .toString(36)
                        .substring(2);

            }

            sessionStorage.setItem(
                "visitorId",
                visitorId
            );
        }


        // =====================================================
        // VARIABLES
        // =====================================================

        let wrongCount = 0;

        let videoLogged = false;


        // =====================================================
        // FORMSPREE LOGGER
        // =====================================================

        async function logEvent(
            event,
            option = ""
        ) {

            try {

                await fetch(
                    FORMSPREE_URL,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"
                        },

                        body: JSON.stringify({

                            visitorId:
                                visitorId,

                            event:
                                event,

                            option:
                                option,

                            wrongCount:
                                wrongCount,

                            time:
                                new Date()
                                    .toISOString(),

                            page:
                                window.location.href
                        })
                    }
                );

            } catch (error) {

                console.error(
                    "Formspree error:",
                    error
                );

            }
        }


        // =====================================================
        // PAGE VISIT
        // =====================================================

        window.addEventListener(
            "load",
            function () {

                logEvent(
                    "Page Visit"
                );

            }
        );


        // =====================================================
        // WRONG CHOICE
        // =====================================================

        function wrongChoice(
            option,
            clickedButton
        ) {

            wrongCount++;


            logEvent(
                "Option Pressed",
                option
            );


            const message =
                document.getElementById(
                    "message"
                );


            const description =
                document.getElementById(
                    "description"
                );


            const nothingButton =
                document.getElementById(
                    "nothing"
                );


            // =================================================
            // MESSAGES
            // =================================================

            if (wrongCount === 1) {

                message.innerHTML =
                    "Hmm... not that one 😏";

                description.innerHTML =
                    "Try again... 👀";

            }

            else if (wrongCount === 2) {

                message.innerHTML =
                    "You touched the wrong one 👀";

                description.innerHTML =
                    "Think carefully... 🤔";

            }

            else if (wrongCount === 3) {

                message.innerHTML =
                    "Really? 😭";

                description.innerHTML =
                    "Are you sure about that? 😂";

            }

            else if (wrongCount === 4) {

                message.innerHTML =
                    "Come on... 😭❤️";

                description.innerHTML =
                    "Choose carefully...";

            }

            else {

                message.innerHTML =
                    "The answer is right there! 👀";

                description.innerHTML =
                    "Don't give up... 😆";

            }


            // =================================================
            // SHAKE WRONG BUTTON
            // =================================================

            clickedButton.classList.remove(
                "shake"
            );

            void clickedButton.offsetWidth;

            clickedButton.classList.add(
                "shake"
            );


            // =================================================
            // MOVE NOTHING BUTTON
            // TO THE POSITION OF THE
            // WRONG BUTTON
            // =================================================

            const clickedRect =
                clickedButton.getBoundingClientRect();

            const nothingRect =
                nothingButton.getBoundingClientRect();


            const clickedCenterX =
                clickedRect.left +
                clickedRect.width / 2;

            const clickedCenterY =
                clickedRect.top +
                clickedRect.height / 2;


            const nothingCenterX =
                nothingRect.left +
                nothingRect.width / 2;

            const nothingCenterY =
                nothingRect.top +
                nothingRect.height / 2;


            const moveX =
                clickedCenterX -
                nothingCenterX;

            const moveY =
                clickedCenterY -
                nothingCenterY;


            /*
                Move the BIG Nothing button
                to the exact location of the
                button that was pressed.
            */

            nothingButton.style.transform =
                `translate(${moveX}px, ${moveY}px)`;


            /*
                Make the correct button slightly
                bigger after each wrong attempt.
            */

            const scale =
                Math.min(
                    1 + wrongCount * 0.03,
                    1.18
                );


            nothingButton.style.transform =
                `translate(${moveX}px, ${moveY}px) scale(${scale})`;

        }


        // =====================================================
        // CORRECT CHOICE
        // =====================================================

        function correctChoice() {

            logEvent(
                "Correct Option Pressed",
                "Nothing"
            );


            document.getElementById(
                "question"
            ).style.display =
                "none";


            document.getElementById(
                "reveal"
            ).style.display =
                "block";


            const video =
                document.getElementById(
                    "finalVideo"
                );


            video.currentTime = 0;


            video.play().catch(
                function () {

                    console.log(
                        "Autoplay was blocked by browser."
                    );

                }
            );


            createFoodEmojis();

        }


        // =====================================================
        // VIDEO PLAYED
        // =====================================================

        function videoStarted() {

            if (!videoLogged) {

                videoLogged = true;


                logEvent(
                    "Video Played",
                    "video.mp4"
                );

            }

        }


        // =====================================================
        // FLOATING FOOD
        // =====================================================

        function createFoodEmojis() {

            const foods = [

                "🍦",
                "🍨",
                "🍧",
                "🍲",
                "🍜",
                "🍕",
                "🍔",
                "🍰",
                "🍩",
                "🍓"

            ];


            for (
                let i = 0;
                i < 25;
                i++
            ) {

                setTimeout(
                    function () {

                        const emoji =
                            document.createElement(
                                "div"
                            );


                        emoji.className =
                            "floating-food";


                        emoji.innerHTML =
                            foods[
                                Math.floor(
                                    Math.random() *
                                    foods.length
                                )
                            ];


                        emoji.style.left =
                            Math.random() *
                            100 +
                            "vw";


                        emoji.style.top =
                            "100vh";


                        emoji.style.animationDuration =
                            (
                                3 +
                                Math.random() * 3
                            ) +
                            "s";


                        document.body.appendChild(
                            emoji
                        );


                        setTimeout(
                            function () {

                                emoji.remove();

                            },
                            7000
                        );

                    },
                    i * 120
                );

            }

        }

    </script>

</body>
</html>
