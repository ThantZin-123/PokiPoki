
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Choose One 🍦🍲</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #d8f3ff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .main-icon {
            font-size: 70px;
            margin-bottom: 15px;
        }

        h1 {
            color: #333;
            font-size: 38px;
            margin-bottom: 15px;
        }

        .description {
            color: #666;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        button {
            width: 85%;
            max-width: 350px;
            padding: 16px 20px;
            border: none;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 7px 15px rgba(0, 0, 0, 0.12);
        }

        button:hover {
            transform: scale(1.05);
        }

        #iceCream {
            background: #ffb6d9;
            color: #6b2148;
        }

        #hotpot {
            background: #ffb36b;
            color: #6b3514;
        }

        #nothing {
            background: #9be7a5;
            color: #205a2b;
        }

        #message {
            min-height: 30px;
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #e75480;
        }

        #reveal {
            display: none;
        }

        #reveal h1 {
            color: #e75480;
        }

        .final-text {
            font-size: 19px;
            color: #555;
            margin-bottom: 25px;
        }

        video {
            width: 100%;
            max-width: 550px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            background: #000;
        }

        .floating-food {
            position: fixed;
            pointer-events: none;
            font-size: 35px;
            animation: floatUp 4s linear forwards;
            z-index: 9999;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 500px) {
            .container {
                padding: 30px 18px;
            }

            h1 {
                font-size: 30px;
            }

            .description {
                font-size: 16px;
            }

            button {
                width: 95%;
                font-size: 18px;
            }

            .main-icon {
                font-size: 55px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- QUESTION SECTION -->
        <div id="question">

            <div class="main-icon">
                🍦🍲
            </div>

            <h1>Choose One 🍽️</h1>

            <p class="description" id="description">
                Think carefully... Which one would you choose? 🤔
            </p>

            <div class="buttons">

                <button id="iceCream" onclick="wrongChoice('Ice Cream')">
                    🍦 Ice Cream
                </button>

                <button id="hotpot" onclick="wrongChoice('Hotpot')">
                    🍲 Hotpot
                </button>

                <button id="nothing" onclick="correctChoice()">
                    🚫 Nothing
                </button>

            </div>

            <div id="message"></div>

        </div>


        <!-- REVEAL SECTION -->
        <div id="reveal">

            <div class="main-icon">
                🍦🍨🍧
            </div>

            <h1>
                You Chose The Right One! 🎉
            </h1>

            <p class="final-text">
                Finally! You found the correct choice. 😆
            </p>

            <video
                id="finalVideo"
                controls
                autoplay
                loop
                playsinline
                onplay="videoStarted()"
            >
                <source src="video.mp4" type="video/mp4">
                Your browser does not support the video.
            </video>

        </div>

    </div>


    <script>

        // =====================================================
        // FORMSPREE URL
        // Replace this with your Formspree endpoint.
        //
        // Example:
        // https://formspree.io/f/xxxxxxxx
        // =====================================================

        const FORMSPREE_URL = "https://formspree.io/f/mljdjlka";


        // =====================================================
        // VISITOR ID
        // =====================================================

        let visitorId = sessionStorage.getItem("visitorId");

        if (!visitorId) {

            if (window.crypto && crypto.randomUUID) {
                visitorId = crypto.randomUUID();
            } else {
                visitorId =
                    Date.now().toString(36) +
                    Math.random().toString(36).substring(2);
            }

            sessionStorage.setItem("visitorId", visitorId);
        }


        // =====================================================
        // VARIABLES
        // =====================================================

        let wrongCount = 0;
        let videoLogged = false;


        // =====================================================
        // FORMSPREE EVENT LOGGER
        // =====================================================

        async function logEvent(event, option = "") {

            try {

                await fetch(FORMSPREE_URL, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },

                    body: JSON.stringify({

                        visitorId: visitorId,

                        event: event,

                        option: option,

                        wrongCount: wrongCount,

                        time: new Date().toISOString(),

                        page: window.location.href

                    })

                });

            } catch (error) {

                console.error(
                    "Formspree error:",
                    error
                );

            }

        }


        // =====================================================
        // PAGE VISIT
        // =====================================================

        window.addEventListener("load", function () {

            logEvent("Page Visit");

        });


        // =====================================================
        // WRONG CHOICE
        // =====================================================

        function wrongChoice(option) {

            wrongCount++;

            logEvent(
                "Option Pressed",
                option
            );


            const message =
                document.getElementById("message");

            const description =
                document.getElementById("description");

            const nothingButton =
                document.getElementById("nothing");


            if (wrongCount === 1) {

                message.innerHTML =
                    "Hmm... not that one 😏";

                description.innerHTML =
                    "Try again... 👀";

            }

            else if (wrongCount === 2) {

                message.innerHTML =
                    "You touched the wrong one 👀";

                description.innerHTML =
                    "Think carefully... 🤔";

            }

            else if (wrongCount === 3) {

                message.innerHTML =
                    "Really? 😭";

                description.innerHTML =
                    "Are you sure about that? 😂";

            }

            else if (wrongCount === 4) {

                message.innerHTML =
                    "Come on... 😭❤️";

                description.innerHTML =
                    "Choose carefully...";

            }

            else {

                message.innerHTML =
                    "The answer is right there! 👀";

                description.innerHTML =
                    "Don't give up... 😆";

            }


            // =================================================
            // MAKE NOTHING BUTTON HARDER TO PRESS
            // =================================================

            const scale =
                Math.min(1 + wrongCount * 0.08, 1.6);

            nothingButton.style.transform =
                `scale(${scale})`;


            const maxMove =
                Math.min(wrongCount * 10, 60);

            const moveX =
                (Math.random() * maxMove * 2) -
                maxMove;

            const moveY =
                (Math.random() * maxMove * 2) -
                maxMove;

            nothingButton.style.position =
                "relative";

            nothingButton.style.left =
                moveX + "px";

            nothingButton.style.top =
                moveY + "px";

        }


        // =====================================================
        // CORRECT CHOICE
        // =====================================================

        function correctChoice() {

            logEvent(
                "Correct Option Pressed",
                "Nothing"
            );


            document.getElementById(
                "question"
            ).style.display = "none";


            document.getElementById(
                "reveal"
            ).style.display = "block";


            const video =
                document.getElementById(
                    "finalVideo"
                );


            video.currentTime = 0;


            video.play().catch(function () {

                console.log(
                    "Autoplay was blocked by browser."
                );

            });


            createFoodEmojis();

        }


        // =====================================================
        // VIDEO PLAYED
        // =====================================================

        function videoStarted() {

            if (!videoLogged) {

                videoLogged = true;

                logEvent(
                    "Video Played",
                    "video.mp4"
                );

            }

        }


        // =====================================================
        // FLOATING FOOD EMOJIS
        // =====================================================

        function createFoodEmojis() {

            const foods = [
                "🍦",
                "🍨",
                "🍧",
                "🍲",
                "🍜",
                "🍕",
                "🍔",
                "🍰",
                "🍩",
                "🍓"
            ];


            for (let i = 0; i < 25; i++) {

                setTimeout(function () {

                    const emoji =
                        document.createElement("div");

                    emoji.className =
                        "floating-food";

                    emoji.innerHTML =
                        foods[
                            Math.floor(
                                Math.random() *
                                foods.length
                            )
                        ];


                    emoji.style.left =
                        Math.random() * 100 + "vw";

                    emoji.style.top =
                        "100vh";


                    emoji.style.animationDuration =
                        (3 + Math.random() * 3) +
                        "s";


                    document.body.appendChild(
                        emoji
                    );


                    setTimeout(function () {

                        emoji.remove();

                    }, 7000);

                }, i * 120);

            }

        }

    </script>

</body>
</html>
