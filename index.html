
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Choose One 🍦🍲</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff1e6, #fffaf5);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 25px;
            border-radius: 30px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.12);
        }

        .main-icon {
            font-size: 60px;
            margin-bottom: 10px;
        }

        h1 {
            color: #e67e22;
            font-size: 32px;
            margin-bottom: 15px;
        }

        #description {
            color: #666;
            font-size: 18px;
            line-height: 1.6;
            min-height: 60px;
            margin-bottom: 15px;
        }

        .wrong-message {
            color: #e67e22;
            font-weight: bold;
            min-height: 25px;
            margin-bottom: 10px;
        }

        .buttons {
            position: relative;
            min-height: 250px;
            width: 100%;
        }

        button {
            border: none;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            padding: 16px 28px;
            transition:
                transform 0.25s,
                left 0.35s,
                top 0.35s;
            box-shadow: 0 7px 18px rgba(0, 0, 0, 0.15);
        }

        #iceCream {
            background: #f5c6d6;
            color: white;
            position: absolute;
            left: 5%;
            top: 20px;
        }

        #hotpot {
            background: #e85d3f;
            color: white;
            position: absolute;
            right: 5%;
            top: 20px;
        }

        #nothing {
            background: #777;
            color: white;
            position: absolute;
            left: 50%;
            top: 130px;
            transform: translateX(-50%);
            z-index: 5;
        }

        #reveal {
            display: none;
            animation: fadeIn 1s ease;
        }

        #reveal h2 {
            color: #e67e22;
            font-size: 30px;
            margin-bottom: 15px;
        }

        #reveal p {
            color: #666;
            font-size: 18px;
            margin-bottom: 20px;
        }

        #finalVideo {
            width: 100%;
            max-width: 450px;
            max-height: 500px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            background: black;
        }

        .food {
            position: fixed;
            bottom: -60px;
            font-size: 30px;
            pointer-events: none;
            animation: floatUp 5s linear forwards;
            z-index: -1;
        }

        @keyframes floatUp {
            from {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            to {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 600px) {

            .container {
                padding: 30px 15px;
            }

            h1 {
                font-size: 27px;
            }

            #description {
                font-size: 16px;
            }

            button {
                font-size: 15px;
                padding: 14px 20px;
            }

            #iceCream {
                left: 2%;
            }

            #hotpot {
                right: 2%;
            }

            #finalVideo {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>

    <div id="foodContainer"></div>

    <div class="container">

        <div id="question">

            <div class="main-icon">🍦🍲</div>

            <h1>Choose One 🍽️</h1>

            <p id="description">
                Think carefully... Which one would you choose? 🤔
            </p>

            <div class="wrong-message" id="wrongMessage"></div>

            <div class="buttons">

                <button
                    id="iceCream"
                    onclick="wrongChoice('Ice Cream')">
                    🍦 Ice Cream
                </button>

                <button
                    id="hotpot"
                    onclick="wrongChoice('Hotpot')">
                    🍲 Hotpot
                </button>

                <button
                    id="nothing"
                    onclick="correctChoice()">
                    🚫 Nothing
                </button>

            </div>

        </div>

        <div id="reveal">

            <div class="main-icon">🍦🍨🍧</div>

            <h2>You Chose The Right One! 🎉</h2>

            <p>
                Finally! You found the correct choice. 😆
            </p>

            <video
                id="finalVideo"
                controls
                autoplay
                loop
                playsinline
                onplay="videoStarted()"
            >
                <source src="video.mp4" type="video/mp4">
                Your browser does not support video.
            </video>

        </div>

    </div>

    <script>

        // =====================================================
        // GOOGLE SHEETS LOGGING URL
        // =====================================================
        // Replace the link below with your Google Apps Script
        // Web App URL.
        //
        // IMPORTANT:
        // The URL should end with /exec
        //
        // Example:
        // https://script.google.com/macros/s/XXXXXXXX/exec
        // =====================================================

        const LOG_URL =
            "https://script.google.com/macros/s/AKfycby_wTiErUxMaVV_a6Kycu9uTZfen-GJHMY-_zGhP0KLCZ7lY61zeSjlsNdeUcAxPn9B/exec";


        let wrongCount = 0;
        let visitCount = 0;
        let videoLogged = false;


        // =====================================================
        // CREATE VISITOR ID
        // =====================================================

        let visitorId =
            sessionStorage.getItem("visitorId");

        if (!visitorId) {

            visitorId =
                crypto.randomUUID();

            sessionStorage.setItem(
                "visitorId",
                visitorId
            );
        }


        // =====================================================
        // SEND DATA TO GOOGLE SHEETS
        // =====================================================

        function logEvent(event, option = "") {

            if (
                !LOG_URL ||
                LOG_URL === "YOUR_GOOGLE_APPS_SCRIPT_URL"
            ) {
                return;
            }

            fetch(LOG_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "text/plain"
                },
                body: JSON.stringify({
                    visitorId: visitorId,
                    event: event,
                    option: option,
                    visitCount: visitCount
                })
            }).catch(() => {});

        }


        // =====================================================
        // RECORD PAGE VISIT
        // =====================================================

        window.addEventListener(
            "load",
            function () {

                visitCount++;

                logEvent(
                    "Page Visit",
                    ""
                );

            }
        );


        // =====================================================
        // DESCRIPTION MESSAGES
        // =====================================================

        const descriptions = [

            "Think carefully... Which one would you choose? 🤔",

            "Hmm... Are you really sure? 🍦",

            "That's not the right one... Try again! 🍲",

            "You chose the wrong food! 😂",

            "Maybe you should think more carefully... 🍨",

            "Really? You want that one? 😏🍜",

            "Nope! That's still not it! 😂",

            "The correct choice is getting bigger... 👀",

            "Look carefully before you choose again! 🍽️",

            "Only one choice is correct! 🤫"

        ];


        // =====================================================
        // WRONG CHOICE MESSAGES
        // =====================================================

        const wrongMessages = [

            "Hmm... not that one! 🍦",

            "Try again! 🍲",

            "Wrong choice! 😂",

            "Think carefully! 🍨",

            "Really? 😏",

            "Nope! 🍜",

            "Choose again! 🍧",

            "Almost... but not quite! 👀"

        ];


        // =====================================================
        // WRONG BUTTON FUNCTION
        // =====================================================

        function wrongChoice(option) {

            wrongCount++;


            document.getElementById(
                "description"
            ).innerText =
                descriptions[
                    Math.min(
                        wrongCount - 1,
                        descriptions.length - 1
                    )
                ];


            document.getElementById(
                "wrongMessage"
            ).innerText =
                wrongMessages[
                    Math.floor(
                        Math.random() *
                        wrongMessages.length
                    )
                ];


            // Record which wrong option was pressed

            logEvent(
                "Option Pressed",
                option
            );


            const nothing =
                document.getElementById(
                    "nothing"
                );


            let scale =
                1 + (wrongCount * 0.12);


            if (scale > 2.2) {
                scale = 2.2;
            }


            moveNothingButton(scale);


            const wrongButton =
                option === "Ice Cream"
                    ? document.getElementById(
                        "iceCream"
                    )
                    : document.getElementById(
                        "hotpot"
                    );


            wrongButton.style.transform =
                "scale(0.9)";


            setTimeout(() => {

                wrongButton.style.transform =
                    "scale(1)";

            }, 250);


            createFood();

        }


        // =====================================================
        // MOVE NOTHING BUTTON
        // =====================================================

        function moveNothingButton(scale) {

            const buttons =
                document.querySelector(
                    ".buttons"
                );


            const nothing =
                document.getElementById(
                    "nothing"
                );


            const areaWidth =
                buttons.clientWidth;


            const areaHeight =
                buttons.clientHeight;


            const buttonWidth =
                nothing.offsetWidth * scale;


            const buttonHeight =
                nothing.offsetHeight * scale;


            const maxX =
                Math.max(
                    0,
                    areaWidth - buttonWidth
                );


            const maxY =
                Math.max(
                    0,
                    areaHeight - buttonHeight
                );


            const randomX =
                Math.random() * maxX;


            const randomY =
                Math.random() * maxY;


            nothing.style.left =
                randomX + "px";


            nothing.style.top =
                randomY + "px";


            nothing.style.transform =
                `scale(${scale})`;

        }


        // =====================================================
        // CORRECT CHOICE
        // =====================================================

        function correctChoice() {

            // Record the correct answer

            logEvent(
                "Correct Option Pressed",
                "Nothing"
            );


            document.getElementById(
                "question"
            ).style.display = "none";


            document.getElementById(
                "reveal"
            ).style.display = "block";


            const video =
                document.getElementById(
                    "finalVideo"
                );


            video.currentTime = 0;

            video.loop = true;


            video.play().catch(() => {});


            createManyFood();

        }


        // =====================================================
        // VIDEO PLAYED
        // =====================================================

        function videoStarted() {

            if (videoLogged) {
                return;
            }


            videoLogged = true;


            // Record that the video was played

            logEvent(
                "Video Played",
                "video.mp4"
            );

        }


        // =====================================================
        // CREATE FLOATING FOOD
        // =====================================================

        function createFood() {

            const food =
                document.createElement(
                    "div"
                );


            food.className =
                "food";


            const foods = [

                "🍦",
                "🍨",
                "🍧",
                "🍲",
                "🍜",
                "🥘",
                "🍛",
                "🍰",
                "🍩"

            ];


            food.innerText =
                foods[
                    Math.floor(
                        Math.random() *
                        foods.length
                    )
                ];


            food.style.left =
                Math.random() * 100 +
                "vw";


            food.style.animationDuration =
                (3 + Math.random() * 3) +
                "s";


            document
                .getElementById(
                    "foodContainer"
                )
                .appendChild(food);


            setTimeout(() => {

                food.remove();

            }, 6000);

        }


        // =====================================================
        // CREATE MANY FOOD EFFECTS
        // =====================================================

        function createManyFood() {

            for (
                let i = 0;
                i < 30;
                i++
            ) {

                setTimeout(() => {

                    createFood();

                }, i * 100);

            }

        }

    </script>

</body>
</html>
